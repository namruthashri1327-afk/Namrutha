<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, Helvetica, sans-serif;
}

body{
height:100vh;
background: url("https://wallpapershome.com/images/pages/pic_h/26430.jpg");
background-color: rgb(22, 2, 54);
background-size:cover;
background-position:center;
}


.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 80px;
color:white;
}

.logo{
font-size:22px;
font-weight:bold;
text-shadow: #a2dcef;
text-shadow: 3px 3px 1px #93c4f3, 3px 3px 5px #a8a8f4; ;
}
.logo h1{
text-shadow: aquamarine;
}

.menu a{
color:white;
text-decoration:none;
margin:0 15px;
}



.container{
display:flex;
justify-content:center;
align-items:center;
height:80vh;
}

.login-box{
display:flex;
width:650px;
background:rgb(247, 245, 245);
border-radius:5px;
overflow:hidden;
border-radius: 25px;
box-shadow:  5px 3px 15px rgb(237, 239, 239);
p {
  text-shadow: 1px 1px 1px #000000, 3px 3px 5px #0e0e10;
}

}
.login-box h2{
  text-shadow: 1px 1px 1px #000000, 3px 3px 5px #0e0e10;
margin-bottom: 25px;
    text-shadow: 2px 2px rgb(26, 26, 26);
    color: #eaf6fa;
}

.left{
background: url("https://www.cognixia.com/wp-content/uploads/2021/08/cognixia-courses.webp");
background-size:cover;
color:rgb(249, 251, 252);
text-shadow: rgb(205, 111, 24);
width:50%;
padding:40px;
display:flex;
flex-direction:column;
justify-content:center;
box-shadow: 5px 0 15px rgba(243, 231, 231, 0.4);
text-shadow: #a8a8f4;
  text-shadow: 1px 1px 1px #000000, 6px 7px 6px #0e0e10;


}

.left h2{
margin-bottom:10px;

}


.right{
width:60%;
padding:40px;
background: url("https://images3.alphacoders.com/140/1400520.jpg");
background-size: 500px;
box-shadow: -5px 0 15px rgba(0,0,0,0.4);
}

.right h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #121111;
border-radius:4px;
}

.forgot{
font-size:13px;
color:#030303;
cursor:pointer;
}

.login{
width:100%;
background:#f1eaf0;
border:none;
padding:10px;
color:rgb(32, 29, 29);
margin-top:15px;
border-radius:4px;
cursor:pointer;
box-shadow: #030303;
box-shadow: 5px 3px 8px rgba(0, 0, 0, 0.5), 5px 0 15px rgba(84, 206, 228, 0.922);
}

.signup{
text-align:center;
margin-top:10px;
font-size:14px;
}

.signup span{
color:#dae3e4;
cursor:pointer;
}

</style>
</head>

<body>


<div class="navbar">
<div class="logo"><h1>CodeMe</h1></div>

<div class="menu">
<a href="#">Home</a>
<a href="#">Courses</a>
<a href="#">About us</a>
<a href="#">Contact us</a>
</div>


</div>



<div class="container">

<div class="login-box">

<div class="left">
<h2>Welcome Back</h2>
<p>To CodeMe.</p><br>
<h2>LOGIN</h2>

<input type="email" placeholder="Email">
<input type="password" placeholder="Password">

<div class="forgot">Forgot password?</div>

<button class="login">Log In</button>
</div>

<div class="right">
    <p> </p>
</div>

</div>

</div>

</body>
</html>
